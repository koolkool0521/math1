<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입체도형 탐구 실험실</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js (3D Library) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- html2canvas (Screenshot Library) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        /* 3D Canvas Container */
        #canvas-container {
            width: 100%;
            height: 400px; /* Slightly taller for better view */
            background: linear-gradient(to bottom, #e0f2fe, #ffffff);
            border-radius: 0.75rem;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }
        .input-blank {
            border-bottom: 2px solid #cbd5e1;
            padding: 0 4px;
            color: #2563eb;
            font-weight: bold;
            outline: none;
            transition: border-color 0.3s;
            background: rgba(255,255,255,0.5);
        }
        .input-blank:focus { border-color: #3b82f6; background: white; }
        .capture-area {
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
            overflow: hidden; 
        }
        .tab-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        .tab-btn { transition: all 0.2s; }
        input[type=range] { accent-color: #3b82f6; }
        /* Control Button Styles */
        .ctrl-btn {
            font-size: 0.75rem; 
            padding: 4px 8px; 
            border-radius: 0.375rem; 
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
            background-color: white;
            color: #4b5563;
        }
        .ctrl-btn:hover { background-color: #f3f4f6; }
        .ctrl-btn.active { background-color: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <!-- Header -->
    <header class="max-w-5xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 flex items-center">
                <i class="fa-solid fa-shapes text-blue-600 mr-2"></i> 입체도형 탐구 실험실
            </h1>
            <p class="text-slate-500 text-sm mt-1">도형을 돌려보고, 자르고, 펼치며 비밀을 찾아보세요.</p>
        </div>
        <button onclick="saveScreenshot()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-full shadow-lg transition flex items-center text-sm">
            <i class="fa-solid fa-camera mr-2"></i> 학습 내용 저장
        </button>
    </header>

    <!-- Navigation Tabs -->
    <div class="max-w-5xl mx-auto mb-4 flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
        <button onclick="switchTab('cylinder')" id="btn-cylinder" class="tab-btn active px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 font-bold whitespace-nowrap text-sm">
            <i class="fa-solid fa-database mr-2"></i>원기둥
        </button>
        <button onclick="switchTab('cone')" id="btn-cone" class="tab-btn px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 font-bold whitespace-nowrap text-sm">
            <i class="fa-solid fa-ice-cream mr-2"></i>원뿔
        </button>
        <button onclick="switchTab('sphere')" id="btn-sphere" class="tab-btn px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 font-bold whitespace-nowrap text-sm">
            <i class="fa-solid fa-basketball mr-2"></i>구
        </button>
        <button onclick="switchTab('revolution')" id="btn-revolution" class="tab-btn px-4 py-2 rounded-full border border-slate-200 bg-white text-slate-600 font-bold whitespace-nowrap text-sm">
            <i class="fa-solid fa-rotate mr-2"></i>회전체 만들기
        </button>
    </div>

    <!-- Main Content Area -->
    <div id="capture-area" class="capture-area max-w-5xl mx-auto bg-white p-6 md:p-8">
        
        <!-- Info Header -->
        <div class="border-b pb-4 mb-6 flex justify-between items-end">
            <div>
                <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">6학년 2학기</span>
                <h2 id="section-title" class="text-xl font-bold text-gray-800 mt-1">원기둥의 비밀 탐구</h2>
            </div>
            <div class="text-right">
                <div class="text-sm text-gray-500">학번/이름</div>
                <input type="text" placeholder="예: 6-1 홍길동" class="text-right font-bold text-gray-700 border-b border-gray-300 focus:outline-none w-40">
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Left: 3D Simulator -->
            <div class="flex flex-col">
                <div class="flex flex-wrap justify-between items-center mb-2 gap-2">
                    <span class="text-sm font-bold text-gray-500"><i class="fa-solid fa-cube mr-1"></i>3D 관찰 도구</span>
                    <!-- Dynamic Controls -->
                    <div id="sim-controls" class="flex flex-wrap gap-1 justify-end"></div>
                </div>
                <div id="canvas-container"></div>
                <p id="sim-guide" class="text-xs text-center text-gray-400 mt-2">
                    <i class="fa-solid fa-mouse"></i> 왼쪽 드래그: 회전 | 휠: 확대/축소 | 오른쪽 드래그: 이동
                </p>
            </div>

            <!-- Right: Interactive Worksheet -->
            <div id="worksheet-content" class="space-y-6 overflow-y-auto max-h-[500px] pr-2">
                <!-- Content injected by JS -->
            </div>
        </div>

        <div class="mt-8 pt-4 border-t text-center text-xs text-gray-400">
            위 내용은 입체도형 탐구 실험실에서 직접 관찰하고 작성한 결과입니다.
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white z-50 flex items-center justify-center hidden">
        <div class="text-center">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
            <p class="mt-4 text-gray-600">이미지 저장 중...</p>
        </div>
    </div>

    <script>
        // --- 1. Content Data ---
        // Defines the worksheet HTML and specific controls for each tab
        const contents = {
            cylinder: {
                title: "원기둥의 비밀 탐구",
                controls: `
                    <button onclick="toggleNet('cylinder')" id="btn-net-cyl" class="ctrl-btn"><i class="fa-solid fa-expand mr-1"></i>전개도</button>
                    <button onclick="toggleCut('h')" id="btn-cut-h" class="ctrl-btn"><i class="fa-solid fa-scissors mr-1"></i>가로 자르기</button>
                    <button onclick="toggleCut('v')" id="btn-cut-v" class="ctrl-btn"><i class="fa-solid fa-scissors mr-1"></i>세로 자르기</button>
                    <button onclick="resetShape()" class="ctrl-btn"><i class="fa-solid fa-rotate-right"></i></button>
                `,
                html: `
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-100">
                        <h3 class="font-bold text-slate-700 mb-3">1. 구성 요소 관찰</h3>
                        <ul class="space-y-3 text-sm text-slate-600">
                            <li>① 위, 아래의 합동인 두 원: <input class="input-blank w-20" type="text"></li>
                            <li>② 옆을 둘러싼 곡면: <input class="input-blank w-20" type="text"></li>
                            <li>③ 두 밑면 사이의 거리: <input class="input-blank w-20" type="text"></li>
                        </ul>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                        <h3 class="font-bold text-blue-800 mb-2">💡 자르기와 펼치기 (단면/전개도)</h3>
                        <ul class="space-y-2 text-sm text-blue-700">
                            <li>• <strong>가로</strong>로 자른 단면의 모양: <input class="input-blank w-20 bg-white" type="text"></li>
                            <li>• <strong>세로</strong>로 자른 단면의 모양: <input class="input-blank w-20 bg-white" type="text"></li>
                            <li>• 전개도에서 <strong>옆면</strong>의 모양: <input class="input-blank w-20 bg-white" type="text"></li>
                        </ul>
                    </div>
                `
            },
            cone: {
                title: "원뿔의 비밀 탐구",
                controls: `
                    <button onclick="toggleNet('cone')" id="btn-net-cone" class="ctrl-btn"><i class="fa-solid fa-expand mr-1"></i>전개도</button>
                    <button onclick="toggleCut('h')" id="btn-cut-h" class="ctrl-btn"><i class="fa-solid fa-scissors mr-1"></i>가로 자르기</button>
                    <button onclick="toggleCut('v')" id="btn-cut-v" class="ctrl-btn"><i class="fa-solid fa-scissors mr-1"></i>세로 자르기</button>
                    <button onclick="resetShape()" class="ctrl-btn"><i class="fa-solid fa-rotate-right"></i></button>
                `,
                html: `
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-100">
                        <h3 class="font-bold text-slate-700 mb-3">1. 구성 요소 관찰</h3>
                        <ul class="space-y-3 text-sm text-slate-600">
                            <li>① 뾰족한 부분의 점: <input class="input-blank w-20" type="text"></li>
                            <li>② 꼭짓점과 밑면을 잇는 선(옆면): <input class="input-blank w-16" type="text"></li>
                            <li>③ 높이와 모선 중 더 긴 것: <input class="input-blank w-16" type="text"></li>
                        </ul>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-lg border border-orange-100">
                        <h3 class="font-bold text-orange-800 mb-2">💡 자르기와 펼치기</h3>
                        <ul class="space-y-2 text-sm text-orange-700">
                            <li>• <strong>가로</strong>로 자른 단면의 모양: <input class="input-blank w-20 bg-white" type="text"></li>
                            <li>• <strong>세로</strong>로 자른 단면의 모양: <input class="input-blank w-20 bg-white" type="text"></li>
                            <li>• 전개도에서 <strong>옆면</strong>의 모양: <input class="input-blank w-20 bg-white" type="text"></li>
                        </ul>
                    </div>
                `
            },
            sphere: {
                title: "구의 비밀 탐구",
                controls: `
                    <button onclick="toggleCut('h')" id="btn-cut-h" class="ctrl-btn"><i class="fa-solid fa-scissors mr-1"></i>가로 자르기</button>
                    <button onclick="toggleCut('v')" id="btn-cut-v" class="ctrl-btn"><i class="fa-solid fa-scissors mr-1"></i>세로 자르기</button>
                    <button onclick="resetShape()" class="ctrl-btn"><i class="fa-solid fa-rotate-right"></i></button>
                `,
                html: `
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-100">
                        <h3 class="font-bold text-slate-700 mb-3">1. 특징 관찰</h3>
                        <ul class="space-y-3 text-sm text-slate-600">
                            <li>① 어느 방향에서 봐도 모양이 같나요? <input class="input-blank w-16" type="text"></li>
                            <li>② 가장 안쪽에 있는 점: <input class="input-blank w-20" type="text"></li>
                            <li>③ 중심에서 겉면까지의 거리: <input class="input-blank w-20" type="text"></li>
                        </ul>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg border border-purple-100">
                        <h3 class="font-bold text-purple-800 mb-2">💡 단면의 비밀</h3>
                        <p class="text-sm text-purple-700 leading-relaxed mb-2">
                            구를 반으로 자르면 단면은 항상 <strong>원</strong>입니다.<br>
                            이때, 중심을 지나는 단면이 가장 ( <input class="input-blank w-12 bg-white text-center" type="text"> ) 원이 됩니다.
                        </p>
                    </div>
                `
            },
            revolution: {
                title: "회전체 만들기 실험실",
                controls: ``,
                html: `
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-100 mb-4">
                        <h3 class="font-bold text-slate-700 mb-3">1. 평면도형 선택하기</h3>
                        <div class="flex gap-2 mb-4">
                            <button onclick="setRevolutionShape('rect')" class="rev-btn flex-1 bg-white border border-gray-300 hover:bg-blue-50 text-xs py-2 rounded text-center font-bold text-slate-600">직사각형</button>
                            <button onclick="setRevolutionShape('tri')" class="rev-btn flex-1 bg-white border border-gray-300 hover:bg-blue-50 text-xs py-2 rounded text-center font-bold text-slate-600">직각삼각형</button>
                            <button onclick="setRevolutionShape('semi')" class="rev-btn flex-1 bg-white border border-gray-300 hover:bg-blue-50 text-xs py-2 rounded text-center font-bold text-slate-600">반원</button>
                        </div>
                        <h3 class="font-bold text-slate-700 mb-2">2. 돌려보기 (회전)</h3>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500">0°</span>
                            <input type="range" id="revSlider" min="0" max="6.28" step="0.1" value="0" class="flex-1" oninput="updateRevolution(this.value)">
                            <span class="text-xs text-gray-500">360°</span>
                        </div>
                        <p class="text-xs text-center text-blue-600 mt-2 font-bold" id="rev-shape-name">도형을 선택하고 슬라이더를 움직여보세요!</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg border border-green-100">
                        <h3 class="font-bold text-green-800 mb-2">💡 회전체 결과</h3>
                        <ul class="space-y-2 text-sm text-green-700">
                            <li>• 직사각형 회전 $\rightarrow$ <input class="input-blank w-20 bg-white" type="text"></li>
                            <li>• 직각삼각형 회전 $\rightarrow$ <input class="input-blank w-20 bg-white" type="text"></li>
                            <li>• 반원 회전 $\rightarrow$ <input class="input-blank w-20 bg-white" type="text"></li>
                        </ul>
                    </div>
                `
            }
        };

        // --- 2. Three.js Setup ---
        let scene, camera, renderer, controls;
        let currentMeshGroup = new THREE.Group();
        let currentTab = 'cylinder';
        let isNetVisible = false;
        let activeCut = null; // 'h', 'v', or null
        let revShapeType = 'rect';

        // Define Clipping Planes
        // Vertical: Cuts along X axis (Normal: -1, 0, 0)
        const planeVert = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
        // Horizontal: Cuts along Y axis (Normal: 0, -1, 0)
        const planeHoriz = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(4, 3, 5);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.localClippingEnabled = true; // Enable Clipping
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            loadShape('cylinder');
            animate();
        }

        function loadShape(type) {
            scene.remove(currentMeshGroup);
            currentMeshGroup = new THREE.Group();
            isNetVisible = false;
            activeCut = null; // Reset cut
            updateCutButtons();

            // Common Material with DoubleSide for "hollow" look inside cut
            // clipShadows: true
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x3b82f6, roughness: 0.3, metalness: 0.1, 
                transparent: true, opacity: 0.9, 
                side: THREE.DoubleSide,
                clippingPlanes: [] // Init empty
            });
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x1e40af, clippingPlanes: [] });

            if (type === 'cylinder') {
                const geometry = new THREE.CylinderGeometry(1, 1, 2.5, 32);
                const mesh = new THREE.Mesh(geometry, material);
                const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), lineMaterial);
                currentMeshGroup.add(mesh, edges);

            } else if (type === 'cone') {
                const geometry = new THREE.ConeGeometry(1.2, 2.5, 32);
                const mesh = new THREE.Mesh(geometry, material);
                // Center cone vertically for cleaner cuts
                const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), lineMaterial);
                currentMeshGroup.add(mesh, edges);

            } else if (type === 'sphere') {
                const geometry = new THREE.SphereGeometry(1.3, 32, 32);
                const mesh = new THREE.Mesh(geometry, material);
                const line = new THREE.LineSegments(new THREE.WireframeGeometry(geometry), new THREE.LineBasicMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.3 }));
                const centerMesh = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({color: 0xff0000}));
                currentMeshGroup.add(mesh, line, centerMesh);

            } else if (type === 'revolution') {
                // Axis Line
                const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -2.5, 0), new THREE.Vector3(0, 2.5, 0)]);
                const axisLine = new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 }));
                currentMeshGroup.add(axisLine);
                setRevolutionShape('rect', true);
            }

            scene.add(currentMeshGroup);
        }

        // --- Cut Logic ---
        function toggleCut(direction) {
            if (activeCut === direction) {
                activeCut = null; // Toggle Off
            } else {
                activeCut = direction; // Set New Cut
            }
            updateCutButtons();
            
            // Apply planes to all meshes in group
            const planes = [];
            if (activeCut === 'h') planes.push(planeHoriz);
            if (activeCut === 'v') planes.push(planeVert);

            currentMeshGroup.traverse((child) => {
                if (child.material) {
                    child.material.clippingPlanes = planes;
                    child.material.needsUpdate = true;
                }
            });
        }

        function updateCutButtons() {
            document.querySelectorAll('.ctrl-btn').forEach(btn => btn.classList.remove('active'));
            if (activeCut === 'h') document.getElementById('btn-cut-h')?.classList.add('active');
            if (activeCut === 'v') document.getElementById('btn-cut-v')?.classList.add('active');
        }

        // --- Net (Unfolding) Logic ---
        function toggleNet(type) {
            // Reset Cuts
            activeCut = null; 
            updateCutButtons();
            
            scene.remove(currentMeshGroup);
            currentMeshGroup = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, side: THREE.DoubleSide });
            const lineMat = new THREE.LineBasicMaterial({ color: 0x1e40af });

            if (!isNetVisible) {
                // Show Net
                if (type === 'cylinder') {
                    // Rect (Body)
                    const rect = new THREE.Mesh(new THREE.PlaneGeometry(6.28, 2.5), material);
                    const rectEdge = new THREE.LineSegments(new THREE.EdgesGeometry(rect.geometry), lineMat);
                    // Circles (Base)
                    const circGeo = new THREE.CircleGeometry(1, 32);
                    const topCirc = new THREE.Mesh(circGeo, material); topCirc.position.y = 2.25;
                    const botCirc = new THREE.Mesh(circGeo, material); botCirc.position.y = -2.25;
                    const topEdge = new THREE.LineSegments(new THREE.EdgesGeometry(circGeo), lineMat); topEdge.position.y = 2.25;
                    const botEdge = new THREE.LineSegments(new THREE.EdgesGeometry(circGeo), lineMat); botEdge.position.y = -2.25;
                    currentMeshGroup.add(rect, rectEdge, topCirc, topEdge, botCirc, botEdge);
                } else if (type === 'cone') {
                    // Sector (Side)
                    // r=1.2, h=2.5, slant(s)=2.77. Theta = 2*PI*r/s = 2.72 rad (~156 deg)
                    const s = 2.77; 
                    const theta = 2.72;
                    const sectorGeo = new THREE.CircleGeometry(s, 32, 0, theta);
                    const sector = new THREE.Mesh(sectorGeo, material);
                    // Rotate so arc is up
                    sector.rotation.z = -theta/2 + Math.PI/2; 
                    const sectorEdge = new THREE.LineSegments(new THREE.EdgesGeometry(sectorGeo), lineMat);
                    sectorEdge.rotation.z = -theta/2 + Math.PI/2;
                    
                    // Base Circle
                    // Attached to the arc? No, usually attached to the point or floating nearby in textbooks.
                    // Let's place it above the vertex.
                    const baseGeo = new THREE.CircleGeometry(1.2, 32);
                    const base = new THREE.Mesh(baseGeo, material);
                    base.position.y = 1.5; 
                    const baseEdge = new THREE.LineSegments(new THREE.EdgesGeometry(baseGeo), lineMat);
                    baseEdge.position.y = 1.5;
                    
                    currentMeshGroup.add(sector, sectorEdge, base, baseEdge);
                }
                
                controls.reset(); 
                camera.position.set(0, 0, 10);
                isNetVisible = true;
                const btnId = type === 'cylinder' ? 'btn-net-cyl' : 'btn-net-cone';
                if(document.getElementById(btnId)) document.getElementById(btnId).innerHTML = '<i class="fa-solid fa-cube mr-1"></i>입체로 보기';
            } else {
                loadShape(type); // Revert
                const btnId = type === 'cylinder' ? 'btn-net-cyl' : 'btn-net-cone';
                if(document.getElementById(btnId)) document.getElementById(btnId).innerHTML = '<i class="fa-solid fa-expand mr-1"></i>전개도';
            }
            scene.add(currentMeshGroup);
        }

        // --- Revolution Logic ---
        function setRevolutionShape(shape, skipClear) {
            revShapeType = shape;
            document.querySelectorAll('.rev-btn').forEach(btn => btn.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-500'));
            // Note: In a real app we'd target specific button, here simplified
            
            if(!skipClear) {
                const axis = currentMeshGroup.children[0];
                currentMeshGroup.clear();
                currentMeshGroup.add(axis);
            }
            updateRevolution(document.getElementById('revSlider')?.value || 0);
            
            const names = {'rect': '직사각형', 'tri': '직각삼각형', 'semi': '반원'};
            if(document.getElementById('rev-shape-name')) document.getElementById('rev-shape-name').innerText = `${names[shape]}을(를) 돌리는 중...`;
        }

        function updateRevolution(val) {
            const angle = parseFloat(val);
            // Cleanup old meshes (keep axis at index 0)
            while(currentMeshGroup.children.length > 1) currentMeshGroup.remove(currentMeshGroup.children[1]);

            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x10b981, roughness: 0.3, metalness: 0.1, side: THREE.DoubleSide, transparent: true, opacity: 0.8 
            });
            const ghostMat = new THREE.LineBasicMaterial({ color: 0x047857 });

            let geometry, points = [];

            if (revShapeType === 'rect') {
                if (angle > 0.1) {
                    geometry = new THREE.CylinderGeometry(1, 1, 2, 32, 1, false, 0, angle);
                    currentMeshGroup.add(new THREE.Mesh(geometry, mat));
                }
                points = [new THREE.Vector3(0,1,0), new THREE.Vector3(1,1,0), new THREE.Vector3(1,-1,0), new THREE.Vector3(0,-1,0)];
            } else if (revShapeType === 'tri') {
                if (angle > 0.1) {
                    geometry = new THREE.ConeGeometry(1.2, 2.5, 32, 1, false, 0, angle);
                    currentMeshGroup.add(new THREE.Mesh(geometry, mat));
                }
                points = [new THREE.Vector3(0,1.25,0), new THREE.Vector3(1.2,-1.25,0), new THREE.Vector3(0,-1.25,0)];
            } else if (revShapeType === 'semi') {
                if (angle > 0.1) {
                    geometry = new THREE.SphereGeometry(1.3, 32, 32, 0, angle);
                    currentMeshGroup.add(new THREE.Mesh(geometry, mat));
                }
                const curve = new THREE.EllipseCurve(0,0,1.3,1.3,-Math.PI/2,Math.PI/2,false,0);
                points = curve.getPoints(30).map(p => new THREE.Vector3(p.x, p.y, 0));
                points.push(new THREE.Vector3(0,1.3,0)); // close loop logic visual
                points.push(new THREE.Vector3(0,-1.3,0));
            }

            // Draw Rotating Outline
            if(points.length > 0) {
                const ghostGeo = new THREE.BufferGeometry().setFromPoints(points);
                const ghost = new THREE.Line(ghostGeo, ghostMat);
                ghost.rotation.y = angle;
                currentMeshGroup.add(ghost);
                // Static Outline
                const staticGhost = new THREE.Line(ghostGeo.clone(), new THREE.LineBasicMaterial({color: 0xcccccc, visible: angle > 0.1}));
                currentMeshGroup.add(staticGhost);
            }
        }

        // --- Common ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white', 'border-blue-600');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            document.getElementById(`btn-${tab}`).classList.add('active', 'bg-blue-600', 'text-white', 'border-blue-600');
            
            document.getElementById('section-title').innerText = contents[tab].title;
            document.getElementById('sim-controls').innerHTML = contents[tab].controls;
            document.getElementById('worksheet-content').innerHTML = contents[tab].html;
            
            loadShape(tab);
        }

        function resetShape() {
            loadShape(currentTab);
        }

        function saveScreenshot() {
            const loading = document.getElementById('loading');
            loading.classList.remove('hidden');
            renderer.render(scene, camera);
            setTimeout(() => {
                html2canvas(document.querySelector("#capture-area"), { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `입체도형_탐구_${new Date().toLocaleTimeString()}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    loading.classList.add('hidden');
                });
            }, 100);
        }

        window.addEventListener('resize', () => {
            const cont = document.getElementById('canvas-container');
            camera.aspect = cont.clientWidth / cont.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(cont.clientWidth, cont.clientHeight);
        });

        init3D();
        switchTab('cylinder');
    </script>
</body>
</html>
